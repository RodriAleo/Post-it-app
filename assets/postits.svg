<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff59a"/>
      <stop offset="1" stop-color="#ffe866"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d64a"/>
      <stop offset="1" stop-color="#d9b92c"/>
    </linearGradient>
    <radialGradient id="pin" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff8a80"/>
      <stop offset="0.6" stop-color="#e53935"/>
      <stop offset="1" stop-color="#b71c1c"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="6" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="rotate(-4 128 132)">
    <!-- hoja con esquina doblada -->
    <path filter="url(#shadow)" fill="url(#paper)"
          d="M40 36 H216 Q222 36 222 42 V178 L174 226 H40 Q34 226 34 220 V42 Q34 36 40 36 Z"/>
    <!-- barra superior -->
    <path fill="#f5e06a" d="M40 36 H216 Q222 36 222 42 V70 H34 V42 Q34 36 40 36 Z"/>
    <!-- esquina doblada -->
    <path fill="url(#fold)" d="M222 178 L174 226 V190 Q174 178 186 178 Z"/>

    <!-- checklist -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="58" y="94" width="24" height="24" rx="4" stroke="#6b6b6b" stroke-width="5"/>
      <path d="M63 106 L69 113 L82 96" stroke="#3f8f3a" stroke-width="7"/>
      <path d="M98 106 H180" stroke="#9a9a9a" stroke-width="7"/>

      <rect x="58" y="138" width="24" height="24" rx="4" stroke="#6b6b6b" stroke-width="5"/>
      <path d="M98 150 H190" stroke="#555" stroke-width="7"/>

      <rect x="58" y="182" width="24" height="24" rx="4" stroke="#6b6b6b" stroke-width="5"/>
      <path d="M98 194 H156" stroke="#555" stroke-width="7"/>
    </g>
  </g>

  <!-- chinche -->
  <ellipse cx="132" cy="44" rx="15" ry="5" fill="#000" opacity="0.22"/>
  <circle cx="128" cy="34" r="17" fill="url(#pin)"/>
  <circle cx="122" cy="28" r="5" fill="#fff" opacity="0.55"/>
</svg>
